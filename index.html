<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e07a5f" />

    <!-- Private party: asks search engines not to index the site.
         Remove this line if you want the site to show up in Google. -->
    <meta name="robots" content="noindex" />

    <title>Vickie 40</title>
    <meta
      name="description"
      content="Everything about the 40th birthday weekend – programme, RSVP, guests and practical info."
    />

    <!-- How the link looks when shared (Messenger, WhatsApp, Facebook ...).
         Replace /og-bilde.svg with your own /og-bilde.jpg (1200 x 630) when you have one. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Vickie turns 40" />
    <meta property="og:description" content="Come celebrate – a weekend in Oslo." />
    <meta property="og:image" content="/og-bilde.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-bilde.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
