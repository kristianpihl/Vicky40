<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a8069" />

    <!-- Private party: asks search engines not to index the site.
         Remove this line if you want the site to show up in Google. -->
    <meta name="robots" content="noindex" />

    <title>Vickie 40</title>
    <meta
      name="description"
      content="Everything about the 40th birthday weekend – programme, RSVP, guests and practical info."
    />

    <!-- How the link looks when shared (Messenger, WhatsApp, Facebook, iMessage ...).
         Uses the same photo as the front page (public/images/forside.jpg).
         The image URL needs to be absolute (with the domain) for most apps
         to pick it up – update this if the site ever moves to another domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://vicky40.vercel.app/" />
    <meta property="og:title" content="Vickie turns 40" />
    <meta property="og:description" content="Come celebrate – a weekend in Oslo." />
    <meta property="og:image" content="https://vicky40.vercel.app/images/forside.jpg" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="2048" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://vicky40.vercel.app/images/forside.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
